name: Deploy demo to GitHub Pages

# GitHub Pages only serves static files, so this publishes the static demo build:
# the same oRPC contract runs in the browser (src/api/local.ts) instead of the Node server.
on:
  push:
    branches: [claude/compassionate-ramanujan-v68rco, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
